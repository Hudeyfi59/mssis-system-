<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSSIS - Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; padding: 20px; color: #334155; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h1 { color: #1e293b; font-size: 24px; margin-bottom: 20px; }
    .stats { display: flex; gap: 20px; margin-bottom: 20px; }
    .card { background: #e0f2fe; padding: 15px 20px; border-radius: 8px; flex: 1; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background: #f1f5f9; color: #475569; }
    tr:hover { background: #f8fafc; }
  </style>
</head>
<body>

<div class="container">
  <h1>MSSIS Admin Dashboard - Liiska Ardayda</h1>
  
  <div class="stats">
    <div class="card">Tirada Guud ee Ardayda: <span id="totalStudents">0</span></div>
  </div>

  <input type="text" id="searchInput" onkeyup="searchStudents()" placeholder="Ka raadi magac, dugsi ama degmo...">

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Magaca Ardayga</th>
        <th>Aabaha</th>
        <th>Dugsiga</th>
        <th>Klass-ka</th>
        <th>Degmada</th>
        <th>Jinsiga</th>
      </tr>
    </thead>
    <tbody id="studentTableBody">
      <tr><td colspan="7">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
  const SUPABASE_URL = "https://egfnjqnglotsyzyfxpxs.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable__3w442NHHaJ5GD01EaNFIw_WeLJw4Xj";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allStudents = [];

  async function loadStudents() {
    const { data, error } = await db.from('students').select('*').order('id', { ascending: true });
    
    if (error) {
      console.error(error);
      return;
    }

    allStudents = data;
    document.getElementById('totalStudents').innerText = data.length;
    renderTable(data);
  }

  function renderTable(students) {
    const tbody = document.getElementById('studentTableBody');
    tbody.innerHTML = '';

    if (students.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7">Wax arday ah laguma meelaynin.</td></tr>';
      return;
    }

    students.forEach(s => {
      const row = `<tr>
        <td>${s.id}</td>
        <td>${s.first_name}</td>
        <td>${s.father_name}</td>
        <td>${s.school}</td>
        <td>${s.student_class}</td>
        <td>${s.district}</td>
        <td>${s.gender}</td>
      </tr>`;
      tbody.innerHTML += row;
    });
  }

  function searchStudents() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allStudents.filter(s => 
      s.first_name.toLowerCase().includes(query) ||
      s.father_name.toLowerCase().includes(query) ||
      s.school.toLowerCase().includes(query) ||
      s.district.toLowerCase().includes(query)
    );
    renderTable(filtered);
  }

  loadStudents();
</script>

</body>
</html>
