<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSSIS - Geli Darajooyinka Imtixaanka</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; padding: 20px; }
    .form-card { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h2 { color: #1e293b; text-align: center; }
    label { font-weight: bold; font-size: 14px; margin-top: 10px; display: block; }
    input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #059669; color: white; font-weight: bold; border: none; border-radius: 6px; margin-top: 20px; cursor: pointer; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="form-card">
  <h2>Gelinta Darajooyinka Imtixaanka</h2>
  <form id="resultForm">
    <label>ID-ga Ardayga:</label>
    <input type="text" id="student_id" placeholder="MOG00001" required>

    <label>Darajada Maaddada Math (100%):</label>
    <input type="number" id="math" max="100" min="0" required>

    <label>Darajada Maaddada English (100%):</label>
    <input type="number" id="english" max="100" min="0" required>

    <label>Darajada Maaddada Somali (100%):</label>
    <input type="number" id="somali" max="100" min="0" required>

    <button type="submit">Kaydi Darajooyinka</button>
  </form>
  <p id="status"></p>
</div>

<script>
  const SUPABASE_URL = "https://egfnjqnglotsyzyfxpxs.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable__3w442NHHaJ5GD01EaNFIw_WeLJw4Xj";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('resultForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('status');
    status.style.color = "blue";
    status.innerText = "Kaydinayaa...";

    const student_id = document.getElementById('student_id').value;
    const math = Number(document.getElementById('math').value);
    const english = Number(document.getElementById('english').value);
    const somali = Number(document.getElementById('somali').value);
    const total = math + english + somali;

    const { error } = await db.from('exam_results').insert([{
      student_id, math, english, somali, total
    }]);

    if (error) {
      status.style.color = "red";
      status.innerText = "Khasaaray: " + error.message;
    } else {
      status.style.color = "green";
      status.innerText = "Darajooyinka si guul leh ayaa loo kaydiyay!";
      document.getElementById('resultForm').reset();
    }
  });
</script>

</body>
</html>
