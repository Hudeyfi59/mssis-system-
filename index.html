<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSSIS - Ministry Student Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; margin: 0; padding: 0; }
    
    /* Navigation Bar Header */
    .navbar { background: #0f172a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .navbar h1 { color: white; margin: 0; font-size: 18px; }
    .nav-links { display: flex; gap: 10px; margin-top: 10px; }
    .nav-links a { color: white; background: #334155; padding: 8px 12px; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: bold; }
    .nav-links a:hover { background: #2563eb; }
    
    .container { max-width: 500px; margin: 30px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h2 { color: #1e293b; text-align: center; }
    label { font-weight: bold; font-size: 14px; margin-top: 10px; display: block; }
    input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; font-weight: bold; border: none; border-radius: 6px; margin-top: 20px; cursor: pointer; }
    #msg { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<!-- Direct Navigation Menu -->
<div class="navbar">
  <h1>MSSIS PORTAL</h1>
  <div class="nav-links">
    <a href="index.html">Diwaan-galinta</a>
    <a href="login.html">Ardayda Login</a>
    <a href="admin.html">Admin Dashboard</a>
    <a href="admin-results.html">Geli Darajooyinka</a>
  </div>
</div>

<div class="container">
  <h2>Diwaan-gelinta Ardayga</h2>
  <form id="studentForm">
    <label>Magaca Ardayga:</label>
    <input type="text" id="first_name" required>

    <label>Magaca Aabaha:</label>
    <input type="text" id="father_name" required>

    <label>Magaca Hooyada:</label>
    <input type="text" id="mother_name" required>

    <label>Dugsiga (School):</label>
    <input type="text" id="school" required>

    <label>Klass-ka (Class):</label>
    <input type="text" id="student_class" required>

    <label>Degmada (District):</label>
    <select id="district" required>
      <option value="">Dooro Degmada...</option>
      <option value="Hodan">Hodan</option>
      <option value="Howlwadaag">Howlwadaag</option>
      <option value="Waberi">Waberi</option>
      <option value="Karan">Karan</option>
      <option value="Yaqshid">Yaqshid</option>
      <option value="Daynile">Daynile</option>
    </select>

    <label>Taariikhda Dhalashada (DOB):</label>
    <input type="date" id="dob" required>

    <label>Jinsiga (Gender):</label>
    <select id="gender" required>
      <option value="LAB">LAB</option>
      <option value="DHOO">DHEDDIG</option>
    </select>

    <label>Password-ka Ardayga:</label>
    <input type="password" id="password" required>

    <button type="submit">Geli Nidaamka</button>
  </form>
  <p id="msg"></p>
</div>

<script>
  const SUPABASE_URL = "https://egfnjqnglotsyzyfxpxs.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable__3w442NHHaJ5GD01EaNFIw_WeLJw4Xj";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('studentForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.style.color = "blue";
    msg.innerText = "Kaydinayaa...";

    const studentData = {
      first_name: document.getElementById('first_name').value,
      father_name: document.getElementById('father_name').value,
      mother_name: document.getElementById('mother_name').value,
      school: document.getElementById('school').value,
      student_class: document.getElementById('student_class').value,
      district: document.getElementById('district').value,
      dob: document.getElementById('dob').value,
      gender: document.getElementById('gender').value,
      password: document.getElementById('password').value
    };

    const { data, error } = await db.from('students').insert([studentData]).select();

    if (error) {
      msg.style.color = "red";
      msg.innerText = "Error: " + error.message;
    } else {
      msg.style.color = "green";
      msg.innerText = "Ardayga si guul leh ayaa loo diwaan-galiyay! ID-giisa waa: " + data[0].id;
      document.getElementById('studentForm').reset();
    }
  });
</script>

</body>
</html>
